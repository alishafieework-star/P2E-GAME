<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>P2E HTML5 Game Stage Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #141218;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <script>
    // ── Bridge Helper ────────────────────────────────────────────────────────
    const Bridge = {
      ready: () => {
        if (window.flutter_inappwebview) {
          window.flutter_inappwebview.callHandler('onGameReady');
        }
      },
      sendScore: (score) => {
        if (window.flutter_inappwebview) {
          window.flutter_inappwebview.callHandler('onScore', score);
        }
      },
      reward: (pts) => {
        if (window.flutter_inappwebview) {
          window.flutter_inappwebview.callHandler('onReward', pts);
        }
      },
      gameOver: () => {
        if (window.flutter_inappwebview) {
          window.flutter_inappwebview.callHandler('onGameOver');
        }
      }
    };

    // ── Game Canvas ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    let W, H;
    function resize() {
      W = canvas.width = window.innerWidth * window.devicePixelRatio;
      H = canvas.height = window.innerHeight * window.devicePixelRatio;
    }
    window.addEventListener('resize', resize);
    resize();

    let paused = false;
    window.addEventListener('p2e:pause', () => { paused = true; });
    window.addEventListener('p2e:resume', () => { paused = false; });

    let score = 0;
    let targetX = W / 2;
    let playerX = W / 2;
    const playerY = () => H - 120 * window.devicePixelRatio;
    const playerW = () => 90 * window.devicePixelRatio;
    const playerH = () => 20 * window.devicePixelRatio;

    const coins = [];
    const particles = [];

    function spawnCoin() {
      const r = 16 * window.devicePixelRatio;
      coins.push({
        x: r + Math.random() * (W - r * 2),
        y: -r,
        vy: (3 + Math.random() * 2) * window.devicePixelRatio,
        r: r,
        color: '#ffb74d'
      });
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 8; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (2 + Math.random() * 4) * window.devicePixelRatio;
        particles.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          alpha: 1,
          color: color
        });
      }
    }

    // Touch input
    function handlePointer(e) {
      e.preventDefault();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      targetX = clientX * window.devicePixelRatio;
    }
    canvas.addEventListener('touchstart', handlePointer, { passive: false });
    canvas.addEventListener('touchmove', handlePointer, { passive: false });
    canvas.addEventListener('mousemove', handlePointer);

    let frame = 0;
    function loop() {
      requestAnimationFrame(loop);
      if (paused) return;

      frame++;
      if (frame % 45 === 0) {
        spawnCoin();
      }

      // Smooth player movement
      playerX += (targetX - playerX) * 0.18;

      // Update coins
      const py = playerY();
      const pw = playerW();
      const ph = playerH();

      for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        c.y += c.vy;

        // Catch check
        if (Math.abs(c.x - playerX) < (pw / 2 + c.r) &&
            Math.abs(c.y - py) < (ph / 2 + c.r)) {
          score += 10;
          Bridge.sendScore(score);
          if (score % 50 === 0) {
            Bridge.reward(25);
          }
          spawnParticles(c.x, c.y, c.color);
          coins.splice(i, 1);
          continue;
        }

        if (c.y > H + c.r) {
          coins.splice(i, 1);
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      // Render
      ctx.fillStyle = '#141218';
      ctx.fillRect(0, 0, W, H);

      // Stars background
      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      for (let i = 0; i < 30; i++) {
        const sx = ((i * 127 + frame * 0.4) % W);
        const sy = ((i * 83 + frame * 0.2) % H);
        ctx.fillRect(sx, sy, 2, 2);
      }

      // Draw coins
      for (const c of coins) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fillStyle = c.color;
        ctx.shadowColor = '#ffb74d';
        ctx.shadowBlur = 10 * window.devicePixelRatio;
        ctx.fill();
        ctx.restore();
      }

      // Draw particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4 * window.devicePixelRatio, 4 * window.devicePixelRatio);
        ctx.restore();
      }

      // Draw player paddle
      ctx.save();
      ctx.beginPath();
      const px = playerX - pw / 2;
      const rad = 8 * window.devicePixelRatio;
      ctx.roundRect ? ctx.roundRect(px, py, pw, ph, rad) : ctx.rect(px, py, pw, ph);
      ctx.fillStyle = '#b388ff';
      ctx.shadowColor = '#b388ff';
      ctx.shadowBlur = 14 * window.devicePixelRatio;
      ctx.fill();
      ctx.restore();
    }

    // Start
    requestAnimationFrame(loop);
    setTimeout(() => {
      Bridge.ready();
    }, 150);
  </script>
</body>
</html>
