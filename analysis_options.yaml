include: package:flutter_lints/flutter.yaml

plugins:
  riverpod_lint: ^3.1.9

analyzer:
  exclude:
    # Independently analyzed with their own package configurations.
    - packages/**
    - apps/**
    # Dev-only inspector packages, analyzed in their own contexts (D-037–D-042).
    - dev_tools/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
