<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>P2E Sign-in Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: 402x874 phone (Figma "Authentication" page) + test console. Every value below comes from the Figma file's variables and auto-layout. Dark-only, as in the design. */
:root{
  color-scheme:dark;
  --surface-base:#0a0a0a; --container:#171717; --container-high:#262626; --container-highest:#404040;
  --outline-variant:#262626; --outline-base:#404040;
  --on-emphasis:#ffffff; --on-base:#a1a1a1; --on-variant:#737373; --on-muted:#525252; --on-disabled:#404040;
  --primary:#00a6f4; --primary-press:#0093d8; --primary-container:rgba(0,166,244,.1);
  --rose:#ff2056; --rose-container:rgba(255,32,86,.1); --green:#00c951; --green-container:rgba(0,201,81,.1); --amber:#ff9f0a;
  --c-purple:#d0c4e8; --p-purple:#604598; --c-teal:#d3f7ff; --p-teal:#014f5a; --c-pink:#eeb0c6; --p-pink:#83244d;
  --c-cyan:#c0f0ff; --p-cyan:#004a74; --c-emerald:#a1f2dc; --p-emerald:#005143;
  --ps:#1447e6; --xbox:#00a63e;
  --canvas:#1c1c1c; --panel:#111111;
  --f:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sf:-apple-system,'SF Pro Text','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--on-emphasis);font-family:var(--f);letter-spacing:-.04em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{display:flex;gap:28px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
svg{display:block;flex:none}

/* ---------- phone 402 x 874 ---------- */
.phone-fit{width:402px;height:874px;flex:none;position:relative}
.phone{position:absolute;left:0;top:0;transform-origin:0 0;width:402px;height:874px;background:var(--surface-base);border-radius:52px;position:relative;overflow:hidden;box-shadow:0 0 0 10px #000,0 0 0 11px #333,0 30px 80px rgba(0,0,0,.55)}

.status{position:absolute;inset:0 0 auto;height:55px;padding-top:10px;display:flex;align-items:center;z-index:5;pointer-events:none}
.status .time{flex:1;padding-left:40px;font:590 17px/22px var(--sf);letter-spacing:0}
.status .island{width:125px}
.status .lv{flex:1;display:flex;gap:10px;justify-content:center;align-items:center;padding-right:16px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:55px}
.screen.enter{animation:inR .24s ease-out}.screen.back-in{animation:inL .24s ease-out}
@keyframes inR{from{opacity:0;transform:translateX(20px)}}@keyframes inL{from{opacity:0;transform:translateX(-20px)}}

/* app bar: 64 tall, 16 side padding, 48 icon slots */
.appbar{height:64px;flex:none;display:flex;align-items:center;padding:0 16px}
.appbar .slot{width:48px;height:48px;display:grid;place-items:center}
.appbar .ab-sp{flex:1}
.backbtn{padding:4px;border-radius:10px;background:var(--container);display:grid;place-items:center}
.backbtn:hover{background:var(--container-high)}

.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.ph{padding:8px 24px;display:flex;flex-direction:column}
.ph h1{margin:0;font-weight:600;font-size:24px;line-height:30px}
.ph p{margin:0;min-height:24px;display:flex;align-items:center;font-weight:500;font-size:16px;line-height:20px;color:var(--on-base)}
.ph p b{font-weight:600;font-size:14px;line-height:18px;color:var(--on-emphasis);margin-left:4px}
.form{flex:1;min-height:0;padding:20px;display:flex;flex-direction:column}
.fields{display:flex;flex-direction:column;gap:12px}
.cta{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding-top:16px}

/* buttons */
.btn{height:46px;width:100%;border-radius:12px;padding:16px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;line-height:20px;background:var(--primary);color:var(--on-emphasis);transition:background .15s}
.btn:hover{background:var(--primary-press)}
.btn:disabled{background:var(--container);color:var(--on-disabled);cursor:default}
.btn.busy{pointer-events:none}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tlink{color:var(--primary);font-weight:600;font-size:14px;line-height:18px}
.row-c{display:flex;align-items:center;justify-content:center}
.row-c .lbl{color:var(--on-variant);font-weight:600;font-size:14px;line-height:18px}
.row-c .tlink{padding:0 4px}

/* text field (Base Text Field - Dark Mode) */
.tf{display:flex;flex-direction:column;gap:8px;width:100%}
.tf-box{height:60px;border:2px solid var(--outline-variant);border-radius:16px;background:var(--container);padding:6px 14px;display:flex;align-items:center;gap:8px;cursor:text;transition:height .15s,padding .15s,border-color .15s}
.tf.active .tf-box{height:64px;padding:8px 14px;border-color:var(--outline-base)}
.tf.err .tf-box{border-color:var(--outline-variant)}
.tf-main{position:relative;flex:1;min-width:0;height:44px}
.tf-main input{position:absolute;left:0;right:0;top:20px;height:24px;width:100%;background:none;border:0;outline:none;padding:0;color:var(--on-emphasis);font:600 16px/24px var(--f);letter-spacing:0;caret-color:var(--on-emphasis)}
.tf-main input.lg{font-size:18px;letter-spacing:-.04em}
.tf-main input[type=password]{letter-spacing:.18em;font-size:16px}
.tf-main input::placeholder{color:var(--on-muted);font-weight:500;letter-spacing:-.04em}
.tf-main label{position:absolute;left:0;top:0;height:20px;display:flex;align-items:center;font-weight:500;font-size:14px;line-height:18px;color:var(--on-variant);white-space:nowrap;pointer-events:none;transition:top .15s,font-size .15s,color .15s}
.tf:not(.active) .tf-main label{top:12px;font-size:16px;line-height:20px;color:var(--on-base)}
.tf:not(.active) .tf-main input{opacity:0}
.tf.err .tf-main label{color:var(--rose)}
.tf-trail{width:44px;height:44px;display:grid;place-items:center;color:var(--on-variant);margin-right:-6px;border-radius:10px}
.status-badge{display:flex;align-items:center;padding:6px 8px;border-radius:10px;font-weight:500;font-size:14px;line-height:18px;white-space:nowrap;gap:2px}
.status-badge .ic18{width:18px;height:18px;display:grid;place-items:center}
.status-badge.no{background:var(--rose-container);color:var(--rose)}
.status-badge.ok{background:var(--green-container);color:var(--green)}
.status-badge.wait{color:var(--on-variant)}
.sup{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--container);font-weight:500;font-size:14px;line-height:18px;color:var(--on-base)}
.sup.err{background:var(--rose-container);color:var(--rose)}
.sup.ok{background:var(--green-container);color:var(--green)}

/* profile card (Continue as / Logging in as) */
.profile{display:flex;align-items:center;gap:10px;padding:10px;border-radius:18px;background:var(--container)}
.profile .avs{width:48px;height:48px;display:grid;place-items:center}
.profile .pc{flex:1;min-width:0}
.profile .pc small{display:block;height:20px;line-height:20px;font-weight:500;font-size:14px;color:var(--on-variant)}
.profile .pc b{display:block;height:24px;line-height:24px;font-weight:600;font-size:16px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile .tlink{align-self:stretch;padding:12px;border-radius:10px}

/* avatar */
.av{border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:600;flex:none;position:relative}
.av svg,.av img{width:100%;height:100%;object-fit:cover}

/* radio (Remember me) */
.remember{display:flex;align-items:center;gap:10px}
.radio{flex:1;display:flex;align-items:center;cursor:pointer;user-select:none}
.radio input{position:absolute;opacity:0;width:1px;height:1px}
.radio .ri{padding:8px}
.radio .box{width:20px;height:20px;border-radius:8px;border:1.5px solid var(--outline-base);display:grid;place-items:center}
.radio input:checked + .ri .box{background:var(--primary);border-color:var(--primary)}
.radio input:checked + .ri .box::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.radio input:focus-visible + .ri .box{outline:2px solid var(--primary);outline-offset:2px}
.radio span.t{padding:0 4px;font-weight:400;font-size:16px;line-height:20px;color:var(--on-base)}
.remember .tlink{padding:8px 12px;border-radius:10px}

/* welcome */
.screen.welcome{padding-top:0}
.hero{height:235px;flex:none;position:relative;overflow:visible;z-index:0}
.hero .bg{position:absolute;left:0;bottom:-29px;width:402px;height:264px;overflow:hidden;pointer-events:none}
.hero .bg img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:42% 38%}
/* inner shadow (Figma Background frame): dark vignette on every edge, strongest at the bottom so it melts into the page */
.hero .bg::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 56px 26px #0a0a0a, inset 0 -70px 60px -10px #0a0a0a;
  background:linear-gradient(180deg,rgba(10,10,10,.45) 0%,rgba(10,10,10,0) 30%,rgba(10,10,10,0) 55%,rgba(10,10,10,.85) 88%,#0a0a0a 100%)}
.wh{padding:24px;display:flex;flex-direction:column;gap:8px}
.wh h1{margin:0;font-weight:600;font-size:32px;line-height:40px}
.wh p{margin:0;font-weight:500;font-size:18px;line-height:24px;color:var(--on-base)}
.bonus-row{padding:8px 20px;display:flex}
.chip{height:32px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:16px;background:var(--container)}
.chip .ci{width:24px;height:24px;border-radius:16px;background:var(--c-pink);display:grid;place-items:center}
.chip .amt{display:flex;align-items:center;gap:4px}
.chip .amt b{font-weight:600;font-size:16px;line-height:20px;letter-spacing:0}
.chip .amt small{font-weight:400;font-size:14px;line-height:18px;color:var(--on-variant)}
.chip .lb{font-weight:600;font-size:16px;line-height:20px}
.wform{padding:20px;display:flex;flex-direction:column;gap:12px}
.divider{display:flex;align-items:center;gap:10px;padding:0 32px;font-weight:400;font-size:14px;line-height:18px;color:var(--on-muted)}
.divider::before,.divider::after{content:"";flex:1;height:1.5px;background:var(--container-high)}
.social{flex:1;display:flex;gap:10px;align-items:flex-start;padding:24px}
.social button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:14px;line-height:18px}
.social .tile{width:100%;height:38px;border-radius:12px;display:grid;place-items:center}
.social button:hover .tile{filter:brightness(1.12)}
.legal{padding:24px;text-align:center;font-weight:400;font-size:14px;line-height:18px;color:var(--on-base);margin:0}
.legal b{font-weight:600;color:var(--primary)}
.welcome .divider,.welcome .social,.welcome .legal{transition:opacity .2s}
.welcome.typing .hero{height:55px}
.no-tr .hero,.no-tr .hero .bg,.no-tr .divider,.no-tr .social,.no-tr .legal{transition:none!important}
.welcome.typing .divider,.welcome.typing .social,.welcome.typing .legal{display:none}
.welcome.typing .wform{flex:1}
.welcome.typing .wform .cta{display:flex}
.welcome .wform .cta{flex:1;padding-top:0}

/* OTP */
.otp{position:relative;display:flex;flex-direction:column;gap:8px}
.otp input{position:absolute;left:0;right:0;top:0;height:62px;width:100%;opacity:0;z-index:2;font-size:16px;caret-color:transparent}
.otp-row{display:flex;gap:8px;align-items:center;height:62px}
.otp-row .bx{flex:1;height:62px;border:2px solid var(--outline-variant);border-radius:16px;background:var(--container);display:grid;place-items:center;font-weight:600;font-size:24px;line-height:30px}
.otp-row .dash{width:12px;height:4px;border-radius:2px;background:var(--container-highest)}
.otp.focus .bx.cur{border-color:var(--outline-base)}
.otp.focus .bx.cur:empty::after{content:"";width:2px;height:24px;background:var(--on-emphasis);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.otp.err .bx{color:var(--rose)}
.otp.ok .bx{color:var(--green)}
.otp.locked{opacity:.45}
.resend{display:flex;align-items:center;justify-content:center;min-height:36px}
.resend .lbl{font-weight:600;font-size:16px;line-height:20px;color:var(--on-variant)}
.resend .tlink{font-size:16px;line-height:20px;padding:8px}
.resend .t{font-weight:600;font-size:16px;color:var(--on-muted);padding:8px;font-variant-numeric:tabular-nums;letter-spacing:0}

/* username ideas */
.ideas{display:flex;flex-direction:column;gap:12px;padding:12px 0}
.ideas .lbl{padding:0 4px;font-weight:500;font-size:16px;line-height:20px;color:var(--on-variant)}
.ideas .list{display:flex;gap:8px}
.ideas button{flex:1;min-width:0;height:36px;border-radius:10px;background:var(--primary-container);color:var(--primary);font-weight:600;font-size:14px;line-height:18px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ideas button:hover{background:rgba(0,166,244,.18)}

/* password power + checklist */
.power{display:flex;flex-direction:column;gap:6px;padding:14px 8px}
.power .lv{display:flex;gap:8px;height:4px}
.power .lv i{flex:1;height:4px;border-radius:2px;background:var(--container-high);transition:background .2s}
.power .q{display:flex;justify-content:space-between;font-size:14px;line-height:18px}
.power .q span{color:var(--on-variant);font-weight:400}
.power .q b{font-weight:600}
.check{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px;border-radius:16px;background:var(--container);margin:0;list-style:none}
.check li{display:flex;align-items:center;gap:6px;font-weight:500;font-size:14px;line-height:18px;color:var(--on-base)}

/* avatar picker */
.picker{display:flex;flex-direction:column;gap:24px;align-items:center;width:100%}
.picker .top{display:flex;flex-direction:column;align-items:center;gap:12px}
.big{position:relative}
.big .badge{position:absolute;right:0;bottom:0;width:32px;height:32px;border-radius:24px;background:var(--container-high);display:grid;place-items:center}
.nick{display:flex;gap:4px;font-weight:600;font-size:20px;line-height:26px}
.nick span:first-child{color:var(--primary)}
.grp{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.grp .ttl{font-weight:600;font-size:14px;line-height:18px;color:var(--on-base)}
.alist{display:flex;gap:10px;justify-content:center}
.alist button{width:52px;height:52px;border-radius:26px;padding:0;position:relative}
.alist button .av{width:52px;height:52px}
.alist button[aria-pressed="true"]::after{content:"";position:absolute;inset:0;border-radius:26px;border:4px solid var(--ring,#604598);box-shadow:inset 0 0 0 5px #fff;pointer-events:none}
.alist .more{background:var(--container);display:grid;place-items:center}
.tlist{display:flex;gap:10px;justify-content:center}
.tlist button{width:24px;height:24px;border-radius:26px;position:relative}
.tlist button[aria-pressed="true"]::after{content:"";position:absolute;inset:0;border-radius:26px;border:2px solid var(--ring,#604598);box-shadow:inset 0 0 0 4px #fff}

/* centered header screens (notifications / all set / welcome back) */
.ch{padding:64px 24px 24px;display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center}
.ch .tc{display:flex;flex-direction:column;align-items:center;gap:8px}
.ch h1{margin:0;font-weight:600;font-size:24px;line-height:30px}
.ch h1.lg{font-size:28px;line-height:36px}
.ch p{margin:0;font-weight:500;font-size:16px;line-height:20px;color:var(--on-base);max-width:354px}
.ch p b{font-weight:600;color:var(--on-emphasis)}
.bellc{width:96px;height:96px;border-radius:96px;background:var(--primary-container);display:grid;place-items:center}
.items{display:flex;flex-direction:column;gap:12px;padding:24px}
.item{display:flex;gap:8px;align-items:center}
.item .ic{width:52px;height:52px;border-radius:16px;background:var(--container);display:grid;place-items:center;flex:none}
.item .tx{flex:1;padding:16px;border-radius:16px;background:var(--container);font-weight:500;font-size:16px;line-height:20px;color:var(--on-base)}
.reward{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--container)}
.reward .ri{width:48px;height:48px;border-radius:12px;background:var(--c-pink);display:grid;place-items:center;flex:none}
.reward .pt{display:flex;flex-direction:column;gap:4px;padding-left:4px}
.reward .pt .amt{display:flex;gap:4px;align-items:baseline}
.reward .pt .amt b{font-weight:600;font-size:20px;line-height:20px;letter-spacing:0;font-variant-numeric:tabular-nums}
.reward .pt .amt small{font-weight:400;font-size:16px;line-height:20px;color:var(--on-muted)}
.reward .pt span{font-weight:500;font-size:14px;line-height:18px;color:var(--on-base)}
.vbadge{position:absolute;right:0;bottom:0;width:34px;height:34px;border-radius:24px;background:var(--container-highest);border:4px solid var(--surface-base);display:grid;place-items:center}
.ctaw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding:20px}
.burst{position:absolute;inset:0;pointer-events:none;z-index:6}

/* home placeholder */
.mission{background:var(--container);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.mission .r{display:flex;justify-content:space-between;font-weight:600;font-size:16px}
.mission .r span{color:var(--primary);font-size:14px}
.mission .bar{height:4px;border-radius:2px;background:var(--container-high);overflow:hidden}.mission .bar i{display:block;height:100%;background:var(--primary)}
.mission small{color:var(--on-variant);font-size:14px}

/* overlays */
.banner{position:absolute;left:10px;right:10px;top:10px;z-index:8;background:rgba(48,48,52,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:22px;padding:12px 14px;display:flex;gap:11px;align-items:flex-start;text-align:left;letter-spacing:0;font-family:var(--sf);transform:translateY(-140%);transition:transform .38s cubic-bezier(.2,.9,.3,1.15)}
.banner.show{transform:none}
.banner .b-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.banner .b-top{display:flex;justify-content:space-between;font-size:14px}.banner .b-top span{color:#a9a9ae}
.banner p{margin:2px 0 0;font-size:14px;line-height:1.35}
.banner small{color:var(--primary);font-weight:600;font-size:12.5px}
.scrim{position:absolute;inset:0;z-index:7;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:28px;animation:fade .2s}
.scrim.bottom{align-items:flex-end;padding:0}
@keyframes fade{from{opacity:0}}
.os{width:272px;border-radius:16px;background:rgba(40,40,42,.98);text-align:center;overflow:hidden;font-family:var(--sf);letter-spacing:0}
.os .t{padding:20px 16px 16px}.os b{display:block;font-size:17px;margin-bottom:4px}.os p{margin:0;font-size:13px;color:#c7c7cc}
.os .acts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #4a4a4e}
.os .acts button{height:46px;color:#0a84ff;font-size:17px}.os .acts button+button{border-left:1px solid #4a4a4e;font-weight:600}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--container);border-radius:24px 24px 0 0;padding:10px 20px 30px;display:flex;flex-direction:column;gap:16px;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--container-highest);margin:0 auto}
.sheet h2{margin:0;font-weight:600;font-size:20px;line-height:26px}
.sheet p{margin:-8px 0 0;font-weight:500;font-size:16px;line-height:20px;color:var(--on-base)}
.sheet .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sheet .grid button{aspect-ratio:1;border-radius:50%;position:relative;max-width:100%}
.sheet .grid button{display:grid;place-items:center;padding:0}

/* ===================== motion layer ===================== */
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--ease-in:cubic-bezier(.4,0,1,1)}
.screen{will-change:transform,opacity;backface-visibility:hidden}
.out-fwd,.out-back{pointer-events:none;z-index:0}
.in-fwd > .body{animation:inF .42s var(--ease) .05s both}
.in-back > .body{animation:inB .42s var(--ease) .05s both}
.out-fwd > .body{animation:outF .26s var(--ease-in) both}
.out-back > .body{animation:outB .26s var(--ease-in) both}
.out-fwd > .appbar,.out-back > .appbar{visibility:hidden}
.appbar.ab-new{animation:fadeIn .32s var(--ease) .12s both}
.appbar .slot.ab-pop{animation:abPop .34s var(--ease) .08s both}
@keyframes abPop{from{opacity:0;transform:scale(.8)}}
@keyframes inF{from{opacity:0;transform:translateX(28px)}}
@keyframes inB{from{opacity:0;transform:translateX(-28px)}}
@keyframes outF{to{opacity:0;transform:translateX(-30px) scale(.985)}}
@keyframes outB{to{opacity:0;transform:translateX(30px) scale(.985)}}
.stag{animation:rise .52s var(--ease) both;animation-delay:calc(var(--i,0) * 38ms + 90ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
.body{overflow:hidden!important}

/* buttons & taps */
.btn{transition:background-color .28s var(--ease),color .28s var(--ease),transform .16s var(--ease),box-shadow .28s var(--ease)}
.btn:not(:disabled):active{transform:scale(.97)}
.btn .spin{animation:sp .7s linear infinite,fadeIn .2s ease}
.tlink,.backbtn,.appbar .slot,.social button,.profile,.acct,.ideas button{transition:transform .16s var(--ease),opacity .16s,background-color .2s}
.tlink:active,.appbar .slot:active{opacity:.6;transform:scale(.95)}
.backbtn:active{transform:scale(.9)}
.social button:active{transform:scale(.95)}
.social .tile{transition:filter .2s,transform .25s var(--ease)}
.social button:hover .tile{transform:translateY(-2px)}
.profile:active,.acct:active{transform:scale(.985)}

/* fields */
.tf-box{transition:height .3s var(--ease),padding .3s var(--ease),border-color .25s ease,background-color .25s ease}
.tf-main label{transition:top .3s var(--ease),font-size .3s var(--ease),line-height .3s var(--ease),color .25s ease}
.tf-main input{transition:opacity .22s ease .06s}
.tf-trail{transition:color .2s,transform .16s var(--ease)}
.tf-trail:active{transform:scale(.88)}
.tf-trail svg{animation:fadeIn .2s ease}
.sup{animation:supIn .34s var(--ease) both}

.sup-slot:empty{display:none}
.status-badge{animation:pop .34s var(--spring) both}
.ideas .lbl{animation:rise .36s var(--ease) both}
.ideas button{animation:rise .42s var(--ease) both}
.ideas button:nth-child(2){animation-delay:.05s}.ideas button:nth-child(3){animation-delay:.1s}
.ideas button:active{transform:scale(.95)}

/* radio */
.radio .box{transition:background-color .2s ease,border-color .2s ease,transform .16s var(--ease)}
.radio:active .box{transform:scale(.88)}
.radio input:checked + .ri .box::after{animation:ckPop .32s var(--spring)}
.radio input:checked + .ri .box{animation:boxPop .32s var(--spring)}
@keyframes ckPop{from{opacity:0;transform:rotate(-45deg) translate(1px,-1px) scale(.3)}to{opacity:1;transform:rotate(-45deg) translate(1px,-1px) scale(1)}}
@keyframes boxPop{0%{transform:scale(.88)}60%{transform:scale(1.08)}100%{transform:scale(1)}}

/* welcome */
.hero{transition:height .65s cubic-bezier(.65,0,.35,1)}
.hero .bg{transition:opacity .45s ease .2s}
.welcome.typing .hero .bg{opacity:0;transition:opacity .4s ease .15s}

/* OTP */

@keyframes ring{0%,100%{transform:rotate(0)}10%{transform:rotate(16deg)}20%{transform:rotate(-14deg)}30%{transform:rotate(11deg)}40%{transform:rotate(-8deg)}50%{transform:rotate(5deg)}60%{transform:rotate(-2deg)}}

@keyframes crown{0%{transform:scale(.4) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(6deg);opacity:1}100%{transform:none}}
.mission .bar i{animation:barIn 1s var(--ease) .3s both}
@keyframes barIn{from{transform:scaleX(0)}}
.mission .bar i{transform-origin:left}

/* overlays */
.scrim{animation:fadeIn .28s ease both}
.sheet{animation:up .46s var(--ease) both}
.os{animation:osIn .32s var(--spring) both}
@keyframes osIn{from{opacity:0;transform:scale(1.14)}}
.scrim.closing{animation:fadeOut .26s ease both}
.scrim.closing .sheet{animation:down .28s var(--ease-in) both}

@keyframes fadeOut{to{opacity:0}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes osOut{to{opacity:0;transform:scale(.94)}}
.sheet .upload{transition:background-color .2s,transform .16s var(--ease)}
.sheet .upload:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.tour-hole.flat::after{display:none}
.tour-hole.moving::after{animation:none;opacity:0}
@keyframes tourPulse{0%{opacity:0;transform:none}15%{opacity:1}100%{opacity:0;transform:scale(var(--sx,1.04),var(--sy,1.06))}}
.tour-tip{position:absolute;padding:16px;border-radius:20px;background:var(--container);color:var(--on-emphasis);box-shadow:0 16px 40px rgba(0,0,0,.55);opacity:0;transform:translateY(8px) scale(.97);transition:opacity .3s ease,transform .4s var(--spring)}
.tour-tip.up{transform:translateY(-8px) scale(.97)}
.tour-tip.show{opacity:1;transform:none;transition-delay:.18s}
.tour-arrow{position:absolute;top:-5px;width:12px;height:12px;margin-left:-6px;background:var(--container);transform:rotate(45deg);border-radius:2px}
.tour-tip.up .tour-arrow{top:auto;bottom:-5px}
.tour-t{display:block;font-weight:600;font-size:18px;line-height:24px;letter-spacing:-.04em}
.tour-d{margin:4px 0 16px;font-weight:500;font-size:14px;line-height:18px;color:var(--on-base);letter-spacing:-.04em}
.tour-f{display:flex;align-items:center;gap:8px}
.tour-n{flex:1;display:flex;align-items:center;gap:4px}
.tour-n i{position:relative;width:16px;height:4px;border-radius:2px;background:var(--container-high);overflow:hidden;transition:width .45s var(--ease)}
.tour-n i::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--primary);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.tour-n i.done::after{transform:none;background:var(--p-cyan)}
.tour-n i.on{width:28px}.tour-n i.on::after{transform:none;transition-delay:.15s}
.tour-skip,.tour-next{height:36px;padding:0 12px;border-radius:10px;font-weight:600;font-size:14px;line-height:18px;letter-spacing:-.04em;white-space:nowrap;transition:transform .15s var(--ease),background-color .2s}
.tour-skip{background:#0a0a0a;color:var(--on-base)}.tour-skip:hover{background:#000;color:#fff}
.tour-next{min-width:64px;background:var(--primary);color:#fff}.tour-next:hover{background:var(--primary-press)}
.tour-skip:active,.tour-next:active{transform:scale(.95)}

/* legal reader (full-screen) */
.legal .lg-link{display:inline;padding:0;font:inherit;font-weight:600;color:var(--primary);border-radius:4px;transition:color .2s}
.legal .lg-link:hover{color:#38bdf8;text-decoration:underline;text-underline-offset:3px}
.lgm{position:absolute;inset:0;z-index:4;background:var(--surface-base,#0a0a0a);display:flex;flex-direction:column;animation:up .46s var(--ease) both}
.lgm.closing{animation:down .3s var(--ease-in) both}
.lg-top{flex:none;padding-top:55px;background:var(--surface-base,#0a0a0a);position:relative;z-index:2;transition:box-shadow .25s}
.lgm.scrolled .lg-top{box-shadow:0 10px 24px rgba(0,0,0,.55)}
.lg-bar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.lg-bar b{font-weight:600;font-size:18px;line-height:24px;letter-spacing:-.04em}
.lg-bar .slot{width:32px}
.lg-tabs{position:relative;margin:0 16px 12px;height:44px;padding:4px;border-radius:14px;background:var(--container);display:grid;grid-template-columns:1fr 1fr}
.lg-tabs button{position:relative;z-index:1;border-radius:10px;font-weight:600;font-size:14px;line-height:18px;letter-spacing:-.04em;color:var(--on-variant);transition:color .25s}
.lg-tabs button[aria-selected="true"]{color:#fff}
.lg-ind{position:absolute;left:4px;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:10px;background:var(--container-high);transition:transform .4s var(--ease)}
.lg-prog{height:2px;background:var(--outline-variant)}
.lg-prog i{display:block;height:100%;background:var(--primary);transform:scaleX(0);transform-origin:left;transition:transform .1s linear}
.lg-sc{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 16px 120px;scrollbar-width:none}
.lg-sc::-webkit-scrollbar{display:none}
.lg-meta{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px;line-height:16px;color:var(--on-variant);letter-spacing:-.02em;margin:0 4px 16px}
.lg-meta i{width:3px;height:3px;border-radius:50%;background:var(--on-muted)}
.lg-key{padding:16px;border-radius:20px;background:var(--container);margin-bottom:12px}
.lg-key b{display:block;font-weight:600;font-size:16px;line-height:20px;letter-spacing:-.04em;margin-bottom:12px}
.lg-key ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.lg-key li{display:flex;gap:10px;font-weight:500;font-size:14px;line-height:19px;color:#d4d4d4;letter-spacing:-.02em}
.lg-key li svg{flex:none;margin-top:-1px}
.lg-toc{padding:8px;border-radius:20px;background:var(--container);margin-bottom:28px;display:flex;flex-direction:column}
.lg-toc > b{padding:8px 8px 6px;font-weight:600;font-size:12px;line-height:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--on-variant)}
.lg-toc button{display:flex;align-items:center;gap:12px;height:40px;padding:0 8px;border-radius:12px;text-align:left;font-weight:500;font-size:14px;line-height:18px;letter-spacing:-.02em;color:#e5e5e5;transition:background .2s}
.lg-toc button:hover{background:var(--container-high)}
.lg-toc button span{width:22px;height:22px;flex:none;border-radius:7px;background:var(--container-high);display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--on-base)}
.lg-toc button svg{margin-left:auto;color:var(--on-muted)}
.lg-s{padding:0 4px;margin-bottom:24px;scroll-margin-top:8px;border-radius:12px}
.lg-s h3{display:flex;gap:6px;margin:0 0 8px;font-weight:600;font-size:17px;line-height:22px;letter-spacing:-.04em}
.lg-s h3 span{color:var(--primary)}
.lg-s p{margin:0;font-weight:400;font-size:15px;line-height:23px;color:var(--on-base);letter-spacing:-.01em}
.lg-s{position:relative}
.lg-s::before{content:"";position:absolute;left:-10px;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--primary);opacity:0;transform:scaleY(.4);transition:opacity .3s,transform .4s var(--ease)}
.lg-s.hl::before{animation:lgHl 1.8s var(--ease) .3s both}
@keyframes lgHl{0%{opacity:0;transform:scaleY(.4)}15%{opacity:1;transform:none}75%{opacity:1;transform:none}100%{opacity:0;transform:none}}
.lg-end{margin:8px 4px 0;padding-top:20px;border-top:1px solid var(--outline-variant);font-weight:500;font-size:13px;line-height:18px;color:var(--on-variant)}
.lg-foot{position:absolute;left:0;right:0;bottom:0;padding:28px 16px 34px;display:flex;gap:8px;align-items:center;background:linear-gradient(180deg,rgba(10,10,10,0),var(--surface-base,#0a0a0a) 40%);z-index:2}

.lg-top-btn{flex:none;width:0;height:46px;margin-right:-8px;border-radius:12px;background:var(--container-high);display:grid;place-items:center;overflow:hidden;opacity:0;transform:scale(.6);transition:width .4s var(--ease),margin .4s var(--ease),opacity .25s,transform .4s var(--spring),background .2s}

.lg-top-btn:hover{background:var(--container-highest)}
.lg-foot .btn{flex:1}
.lg-tabs button:active{transform:scale(.97)}
.lg-tabs button{transition:color .25s,transform .15s var(--ease)}
.lg-ind{transition:transform .45s var(--spring)}
.lg-tabs button:not([aria-selected="true"]):hover{color:#d4d4d4}
.lg-toc button svg{transition:transform .25s var(--ease),color .2s}
.lg-toc button:hover svg{transform:translateX(3px);color:var(--on-base)}
.lg-toc button:active{transform:scale(.98)}
.lg-toc button{transition:background .2s,transform .15s var(--ease)}
.lg-key{background:linear-gradient(180deg,rgba(0,166,244,.07),rgba(0,166,244,0) 60%),var(--container);box-shadow:inset 0 0 0 1px rgba(0,166,244,.12)}

/* letter sizes from Figma: 38→20, 52→24, 96→46 */
function avatarHTML(av, name, size){
  av = av || {mode:'initial', theme:0};
  const t = THEMES[av.theme ?? 0];
  const fs = size >= 90 ? 46 : size >= 50 ? 24 : size >= 44 ? 22 : 20;
  const st = `width:${size}px;height:${size}px`;
  if (av.mode === 'photo') return `<div class="av" style="${st}"><img src="${av.src}" alt="Profile photo"></div>`;
  if (av.mode === 'char') return `<div class="av" style="${st};background:${t.c}">${charSVG(CHARS[av.char])}</div>`;
  const letter = (name || 'A').replace(/[^a-zA-Z0-9]/g,'').charAt(0).toUpperCase() || 'A';
  return `<div class="av" style="${st};background:${t.c};color:${t.p};font-size:${fs}px;letter-spacing:-.05em">${esc(letter)}</div>`;
}

  const v = raw.trim(); if (!v) return null;
  if (v.includes('@')) return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v) ? {type:'email', id:v.toLowerCase(), display:v.toLowerCase()} : {type:'bad', why:'email'};
  let d = v.replace(/[\s\-().]/g,'');
  if (/^\+?\d+$/.test(d)){
    if (d.startsWith('00')) d = '+' + d.slice(2);
    if (/^09\d{9}$/.test(d)) d = '+98' + d.slice(1); else if (/^9\d{9}$/.test(d)) d = '+98' + d;
    if (!d.startsWith('+') || d.length < 11 || d.length > 16 || (d.startsWith('+98') && !/^\+989\d{9}$/.test(d))) return {type:'bad', why:'phone'};
    return {type:'phone', id:d, display:fmtPhone(d)};

}

screens.otp = () => {
  const email = isEmail(), p = S.otpPurpose;
  const cta = p === 'verify' ? (email ? 'Verify Email Address' : 'Verify Phone Number') : p === 'reset' ? 'Reset Password' : 'Login';
  return { html: appbar() + `<div class="body">${pageHead(email ? 'Check Your Inbox' : 'Check Your Messages', `Enter the code we sent to <b>${esc(maskedId())}</b>.`)}
    <div class="form"><div class="fields">
      <div class="otp" id="box"><input id="otp" inputmode="text" autocapitalize="characters" autocomplete="one-time-code" maxlength="7" aria-label="Code: one letter and 5 digits">
        <div class="otp-row" aria-hidden="true"><div class="bx"></div><div class="dash"></div><div class="bx"></div><div class="bx"></div><div class="bx"></div><div class="bx"></div><div class="bx"></div></div>
        <div id="m"></div></div>
      <div class="resend" id="rs"></div>
    </div>
    <div class="cta"><button class="btn" id="go" disabled>${cta}</button><div class="row-c"><span class="lbl">Wrong ${email ? 'Email' : 'Phone'}?</span><button class="tlink" id="chg">Change it</button></div></div></div></div>`,
  mount(el){
    const inp = $('#otp', el), box = $('#box', el), bx = $$('.bx', el), btn = $('#go', el), m = $('#m', el), rs = $('#rs', el);
    const val = () => inp.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
    bx.forEach((b, i) => b.style.setProperty('--k', i)); smooth(m);
    const paint = () => { const v = val(); bx.forEach((b, i) => { const nv = v[i] || ''; if (b.textContent !== nv){ b.textContent = nv; if (nv && !reduce){ b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); } } b.classList.toggle('cur', i === Math.min(v.length, 5)); }); };
    const msg = (t, kind) => { m.innerHTML = t ? supHTML(t, kind) : ''; };
    inp.addEventListener('focus', () => { box.classList.add('focus'); paint(); });
    inp.addEventListener('blur', () => box.classList.remove('focus'));
    inp.addEventListener('input', () => {
      inp.value = val(); box.classList.remove('err'); if (S.otpAttempts < MAX_TRIES) msg('');
      paint(); btn.disabled = inp.value.length < 6; if (inp.value.length === 6) verify();
    });
    const lockOut = () => { inp.disabled = true; box.classList.add('locked'); btn.disabled = true; msg('Too many wrong codes. Request a new code to try again.', 'err'); };
    async function verify(){
      if (btn.classList.contains('busy')) return;
      inp.blur(); await busy(btn, 600);
      if (Date.now() - S.otpSentAt > OTP_TTL){ box.classList.add('err'); msg('This code has expired. Request a new one.', 'err'); return; }
      if (inp.value === S.otp){
        box.classList.add('ok'); msg(S.otpPurpose === 'verify' ? (isEmail() ? 'Email address verified' : 'Phone number verified') : 'Code accepted', 'ok');
        S.otp = null; $('#pCode').textContent = '—'; await wait(650);
        if (S.otpPurpose === 'verify') go('username', {clear:true});
        else if (S.otpPurpose === 'reset') go('createPassword', {clear:true});
        else finishLogin();
        return;
      }
      S.otpAttempts++; box.classList.add('err'); shake(box.querySelector('.otp-row')); btn.disabled = false;
      if (S.otpAttempts >= MAX_TRIES) lockOut();
      else { msg('That Code doesn’t match.', 'err'); }
      setTimeout(() => { if (box.classList.contains('err')){ inp.value = ''; paint(); btn.disabled = true; } }, 900);
    }
    btn.addEventListener('click', verify);
    $('#chg', el).addEventListener('click', () => go('welcome', {clear:true}));
    let last = -1;
    S.tick = () => {
      const left = Math.max(0, RESEND - Math.floor((Date.now() - S.otpSentAt) / 1000));
      if (left === last) return; last = left;
      rs.innerHTML = left > 0 ? `<span class="lbl">Didn’t get it?</span><span class="t">${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}</span>` : `<span class="lbl">Didn’t get it?</span><button class="tlink" id="resend">Resend code</button>`;

    };
    S.tick(); if (S.otpAttempts >= MAX_TRIES) lockOut(); paint(); focusFirst(el, '#otp');
  }};
};

  const P = Array.from({length:110}, () => ({x:r.width/2, y:r.height*.22, vx:(Math.random()-.5)*9, vy:-Math.random()*9-3, s:4+Math.random()*5, c:cols[rand(5)], a:Math.random()*6, va:(Math.random()-.5)*.3}));

function hmQuest(o){
  const d = o.done;
  const st = (kind, k) => kind === 'start' ? `<span class="hm-qn">${I.crown(20, o.started ? '#ffffff' : '#a1a1a1')}</span>`
    : kind === 'end' ? `<span class="hm-qn">${HM_TROPHY}</span>`
    : `<span class="hm-qn ${kind}" style="--d:${.74 + k * .78}s">${QCHECK}</span>`;
  const pts = (t, off) => `<span class="hm-qp${off ? ' off' : ''}"><b>${t}</b><small>pts</small></span>`;
  return `<div class="hm-qc">
    ${hmGameRow(o.icon, o.name, o.by, o.cta, 'Free to Play')}
    <div class="hm-qbody"><div class="hm-qbox">
      <div class="hm-qhead"><div class="hm-qtrack">
        <div class="hm-qm">${st('start')}</div>
        <i class="hm-qbar${d >= 1 ? ' on' : ''}" style="--d:.15s"></i>
        <div class="hm-qm">${pts(o.p[0], d < 1)}${st(d >= 1 ? 'done' : 'idle', 0)}</div>
        <i class="hm-qbar${d >= 2 ? ' on' : ''}" style="--d:.9s"></i>
        <div class="hm-qm">${pts(o.p[1], d < 2)}${st(d >= 2 ? 'done' : 'idle', 1)}</div>
        <i class="hm-qbar rest"></i>
        <div class="hm-qm end">${pts(o.p[2], true)}${st('end')}</div>
      </div></div>
      <div class="hm-qdet"><span class="hm-qstep">${o.status}</span><span class="hm-rw"><span class="ci">${I.crown(14,'#83244d')}</span><b>${o.pts}</b><span class="sl">/</span><b class="tot">1,750</b><small>pts</small></span></div>

let qTimerId = null;
